<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自販機マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root{
    --body:#E9EAE5;
    --panel:#FFFFFF;
    --ink:#1C1F24;
    --sub:#6B7280;
    --cold:#E3262F;
    --hot:#1A63C4;
    --mine:#F5B301;
    --line:#C9CBC3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    color:var(--ink);background:var(--body);
    display:flex;flex-direction:column;overflow:hidden;
  }

  header{
    background:var(--cold);color:#fff;
    padding:10px 14px;
    display:flex;align-items:baseline;gap:10px;flex:none;
  }
  header h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.04em}
  header .count{margin-left:auto;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  header .count small{font-weight:400;opacity:.8}

  #map{flex:1 1 auto;min-height:160px;background:#dcded7}

  .sheet{
    flex:none;background:var(--panel);border-top:3px solid var(--ink);
    max-height:68vh;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bar{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
  .bar.sub{padding-top:0;border-top:1px dashed var(--line)}
  input[type=search],input[type=text]{
    flex:1 1 120px;min-width:0;font:inherit;font-size:15px;padding:9px 10px;
    border:1px solid var(--line);border-radius:4px;background:#F7F7F4;color:var(--ink);
  }
  button{
    font:inherit;font-size:14px;font-weight:700;padding:9px 12px;border:0;border-radius:4px;
    background:var(--ink);color:#fff;cursor:pointer;
  }
  button.ghost{background:#EDEEE9;color:var(--ink);border:1px solid var(--line);font-weight:400}
  button.on{background:var(--mine);color:var(--ink)}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible,input:focus-visible{outline:2px solid var(--hot);outline-offset:1px}

  .radius{display:flex;align-items:center;gap:8px;padding:0 10px 10px;font-size:13px;color:var(--sub);flex:none}
  .radius input{flex:1}
  .radius b{color:var(--ink);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}

  .list{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid #EFEFEA;cursor:pointer}
  .row:active{background:#F7F7F4}
  .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;background:var(--cold)}
  .dot.mine{background:var(--mine)}
  .row .t{flex:1;min-width:0}
  .row .n{font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .m{font-size:12px;color:var(--sub);margin-top:2px}
  .row .d{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;flex:none;margin-top:2px}
  .row .del{background:none;color:var(--sub);font-weight:400;font-size:12px;padding:2px 6px}

  .empty{padding:22px 16px;color:var(--sub);font-size:14px;line-height:1.7}
  .status{padding:10px 12px;font-size:13px;color:var(--sub);border-bottom:1px solid #EFEFEA}
  .status.err{color:var(--cold)}
  .hint{padding:2px 12px 8px;font-size:12px;color:var(--sub);flex:none}

  .pin{display:block;width:16px;height:22px;border-radius:8px 8px 3px 3px;border:2px solid #fff;
       box-shadow:0 1px 3px rgba(0,0,0,.45);background:var(--cold)}
  .pin.mine{background:var(--mine)}
  .leaflet-container{font-family:inherit}
  .leaflet-popup-content{margin:10px 12px;font-size:14px;line-height:1.5}
  .adding #map{cursor:crosshair}
</style>
</head>
<body>

<header>
  <h1>自販機マップ</h1>

  <div class="count"><span id="count">0</span><small> 件</small></div>
</header>

<div id="map"></div>

<div class="sheet">
  <div class="bar">
    <input type="search" id="q" placeholder="住所・駅名で移動" autocomplete="off">
    <button id="here" class="ghost">現在地</button>
    <button id="search">この範囲をOSMで検索</button>
  </div>

  <div class="bar sub">
    <input type="text" id="coord" placeholder="緯度,経度（Google Earthから貼り付け）" autocomplete="off" inputmode="decimal">
    <input type="text" id="pname" placeholder="名前・メモ（任意）" autocomplete="off">
    <button id="addCoord">追加</button>
    <button id="add" class="ghost">地図タップで追加</button>
  </div>

  <div class="radius">
    <label for="r">検索半径</label>
    <input type="range" id="r" min="200" max="3000" step="100" value="800">
    <b id="rv">800 m</b>
  </div>

  <div class="bar">
    <button id="save" class="ghost">data.jsonに保存</button>
    <button id="load" class="ghost">データを読み込む</button>
  </div>

  <div id="status" class="status" hidden></div>
  <div class="list" id="list">
    <div class="empty">読み込み中…</div>
  </div>
</div>

<input type="file" id="file" accept="application/json,.json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
  "use strict";

  var DATA_URL = 'data.json';
  var START = [34.7769, 135.6256]; // 寝屋川市中心
  var BOUNDS = L.latLngBounds(
    [34.68, 135.52],  // 南西（周辺込み）
    [34.88, 135.74]   // 北東
  );

  var map = L.map('map', {
    zoomControl: false,
    maxBounds: BOUNDS,
    maxBoundsViscosity: 1.0,
    minZoom: 12
  }).setView(START, 14);
  L.control.zoom({position:'topright'}).addTo(map);

  var onlineLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
  }).addTo(map);

  var layer = L.layerGroup().addTo(map);
  var circle = null;
  var items = [];
  var markers = {};
  var adding = false;

  var $ = function(id){ return document.getElementById(id); };
  var statusEl = $('status');

  function say(msg, isErr){
    if(!msg){ statusEl.hidden = true; return; }
    statusEl.hidden = false;
    statusEl.textContent = msg;
    statusEl.className = 'status' + (isErr ? ' err' : '');
  }

  function radius(){ return parseInt($('r').value, 10); }

  $('r').addEventListener('input', function(){
    $('rv').textContent = radius() + ' m';
    drawCircle();
  });

  function drawCircle(){
    var c = map.getCenter();
    if(circle) map.removeLayer(circle);
    circle = L.circle(c, {
      radius: radius(), color:'#1C1F24', weight:1, opacity:.5,
      fillColor:'#1C1F24', fillOpacity:.04, interactive:false
    }).addTo(map);
  }
  map.on('moveend', drawCircle);
  drawCircle();

  function dist(a, b){
    var R = 6371000, toRad = Math.PI/180;
    var dLat = (b[0]-a[0])*toRad, dLon = (b[1]-a[1])*toRad;
    var la1 = a[0]*toRad, la2 = b[0]*toRad;
    var h = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return 2*R*Math.asin(Math.sqrt(h));
  }

  function label(tags){
    tags = tags || {};
    if(tags.name) return tags.name;
    var v = tags.vending || '';
    var dict = {
      drinks:'飲料', cigarettes:'たばこ', sweets:'お菓子', food:'食品',
      ice_cream:'アイス', coffee:'コーヒー', water:'水', newspapers:'新聞',
      parking_tickets:'駐車券', public_transport_tickets:'乗車券',
      excrement_bags:'フン袋', bicycle_tube:'自転車用品', condoms:'コンドーム',
      milk:'牛乳', eggs:'卵', bread:'パン', toys:'おもちゃ', umbrellas:'傘'
    };
    var parts = v.split(';').map(function(k){ return dict[k] || k; }).filter(Boolean);
    return parts.length ? parts.join('・') + 'の自販機' : '自販機';
  }

  function meta(it){
    var s = it.source === 'me' ? '自分で追加' : 'OpenStreetMap';
    return it.note ? s + '・' + it.note : s;
  }

  function icon(src){
    return L.divIcon({
      className:'', iconSize:[16,22], iconAnchor:[8,22], popupAnchor:[0,-20],
      html:'<span class="pin' + (src === 'me' ? ' mine' : '') + '"></span>'
    });
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }

  function render(){
    layer.clearLayers();
    markers = {};
    var c = [map.getCenter().lat, map.getCenter().lng];

    items.sort(function(a,b){ return dist(c,[a.lat,a.lon]) - dist(c,[b.lat,b.lon]); });

    items.forEach(function(it){
      var m = L.marker([it.lat, it.lon], {icon: icon(it.source)})
        .bindPopup('<b>' + esc(it.name) + '</b><br>' + esc(meta(it)))
        .addTo(layer);
      markers[it.id] = m;
    });

    $('count').textContent = items.length;

    var list = $('list');
    if(!items.length){
      list.innerHTML = '<div class="empty">まだ自販機がありません。Google Earthで見つけた場所の座標を上の欄に貼り付けるか、地図をタップして追加してください。</div>';
      return;
    }
    list.innerHTML = '';
    items.forEach(function(it){
      var d = Math.round(dist(c,[it.lat,it.lon]));
      var row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<span class="dot' + (it.source === 'me' ? ' mine' : '') + '"></span>' +
        '<span class="t"><span class="n">' + esc(it.name) + '</span>' +
        '<span class="m">' + esc(meta(it)) + '</span></span>' +
        '<span class="d">' + (d >= 1000 ? (d/1000).toFixed(1) + ' km' : d + ' m') + '</span>' +
        '<button class="del" aria-label="削除">✕</button>';
      row.addEventListener('click', function(e){
        if(e.target.classList.contains('del')){
          items = items.filter(function(x){ return x.id !== it.id; });
          render();
          return;
        }
        map.setView([it.lat, it.lon], Math.max(map.getZoom(), 17));
        if(markers[it.id]) markers[it.id].openPopup();
      });
      list.appendChild(row);
    });
  }

  // --- data.json を起動時に読み込む ---
  function loadInitial(){
    fetch(DATA_URL, {cache:'no-store'})
      .then(function(res){
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data){
        var list = Array.isArray(data) ? data : (data && data.items) || [];
        items = list.filter(function(x){
          return x && typeof x.lat === 'number' && typeof x.lon === 'number';
        });
        render();
        say(items.length
          ? 'data.json から ' + items.length + ' 件を読み込みました。'
          : 'data.json は空でした。座標を貼り付けるか地図をタップして追加してください。');
      })
      .catch(function(){
        render();
        say('data.json を読み込めませんでした。ローカルサーバー経由で開くか、GitHub Pages に公開すると読み込めます。', true);
      });
  }

  // --- Overpass API から自販機を取得 ---
  $('search').addEventListener('click', function(){
    var c = map.getCenter(), rad = radius(), btn = this;
    var query =
      '[out:json][timeout:25];(' +
      'node["amenity"="vending_machine"](around:' + rad + ',' + c.lat + ',' + c.lng + ');' +
      'way["amenity"="vending_machine"](around:' + rad + ',' + c.lat + ',' + c.lng + ');' +
      ');out center tags;';

    btn.disabled = true;
    say('OpenStreetMap を検索中…');

    fetch('https://overpass-api.de/api/interpreter', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'data=' + encodeURIComponent(query)
    })
    .then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data){
      var mine = items.filter(function(x){ return x.source === 'me'; });
      var found = (data.elements || []).map(function(el){
        var lat = el.lat != null ? el.lat : (el.center && el.center.lat);
        var lon = el.lon != null ? el.lon : (el.center && el.center.lon);
        if(lat == null || lon == null) return null;
        return {
          id: 'osm-' + el.type + '-' + el.id,
          lat: lat, lon: lon,
          name: label(el.tags),
          note: (el.tags && el.tags.operator) || '',
          source: 'osm'
        };
      }).filter(Boolean);

      items = mine.concat(found);
      render();
      say(found.length ? found.length + ' 件見つかりました。' : 'この範囲には登録がありませんでした。', !found.length);
    })
    .catch(function(err){
      say('検索できませんでした（' + err.message + '）。少し待ってからもう一度試してください。', true);
    })
    .then(function(){ btn.disabled = false; });
  });

  // --- 住所検索（Nominatim） ---
  function geocode(){
    var q = $('q').value.trim();
    if(!q) return;
    say('場所を探しています…');
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q))
      .then(function(r){ return r.json(); })
      .then(function(list){
        if(!list.length){ say('その場所は見つかりませんでした。', true); return; }
        map.setView([parseFloat(list[0].lat), parseFloat(list[0].lon)], 17);
        say(list[0].display_name);
      })
      .catch(function(){ say('場所を検索できませんでした。', true); });
  }
  $('q').addEventListener('keydown', function(e){ if(e.key === 'Enter') geocode(); });

  // --- 現在地 ---
  $('here').addEventListener('click', function(){
    if(!navigator.geolocation){ say('この端末では現在地を取れません。', true); return; }
    say('現在地を取得中…');
    navigator.geolocation.getCurrentPosition(function(pos){
      map.setView([pos.coords.latitude, pos.coords.longitude], 17);
      say('現在地に移動しました。');
    }, function(){
      say('現在地を取得できませんでした。位置情報の許可を確認してください。', true);
    }, {enableHighAccuracy:true, timeout:10000});
  });

  // --- 座標を貼り付けて追加（Google Earth向け） ---
  function addFromCoord(){
    var raw = $('coord').value.trim();
    if(!raw){ say('緯度,経度を入力してください（例: 35.681236, 139.767125）', true); return; }
    var parts = raw.split(/[,\s]+/).map(function(s){ return s.trim(); }).filter(Boolean);
    if(parts.length < 2){ say('緯度と経度をカンマ区切りで入力してください（例: 35.681236, 139.767125）', true); return; }
    var lat = parseFloat(parts[0]), lon = parseFloat(parts[1]);
    if(isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180){
      say('座標が正しくありません。', true); return;
    }
    var name = $('pname').value.trim() || '自販機';
    items.push({ id: 'me-' + Date.now(), lat: lat, lon: lon, name: name, note: '', source: 'me' });
    $('coord').value = '';
    $('pname').value = '';
    map.setView([lat, lon], Math.max(map.getZoom(), 17));
    render();
    say('追加しました。「data.jsonに保存」で書き出せます。');
  }
  $('addCoord').addEventListener('click', addFromCoord);
  $('coord').addEventListener('keydown', function(e){ if(e.key === 'Enter') addFromCoord(); });
  $('pname').addEventListener('keydown', function(e){ if(e.key === 'Enter') addFromCoord(); });

  // --- 手動で追加（地図タップ） ---
  $('add').addEventListener('click', function(){
    adding = !adding;
    this.classList.toggle('on', adding);
    document.body.classList.toggle('adding', adding);
    this.textContent = adding ? 'タップして追加中' : '地図タップで追加';
    say(adding ? '自販機のある場所を地図でタップしてください。' : '');
  });

  map.on('click', function(e){
    if(!adding) return;
    var name = window.prompt('自販機の名前やメモ（例：〇〇公園前・コカコーラ）', '自販機');
    if(name === null) return;
    items.push({
      id: 'me-' + Date.now(),
      lat: e.latlng.lat, lon: e.latlng.lng,
      name: name.trim() || '自販機',
      note: '', source: 'me'
    });
    render();
  });

  // --- 保存 / 読み込み（自販機データ） ---
  $('save').addEventListener('click', function(){
    if(!items.length){ say('保存するものがありません。', true); return; }
    var data = {
      version: 1,
      center: {lat: map.getCenter().lat, lon: map.getCenter().lng},
      savedAt: new Date().toISOString(),
      items: items
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'data.json';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    say(items.length + ' 件を data.json に書き出しました。プロジェクトの data.json をこれで置き換えてください。');
  });

  $('load').addEventListener('click', function(){ $('file').click(); });
  $('file').addEventListener('change', function(e){
    var f = e.target.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        var list = Array.isArray(data) ? data : (data && data.items);
        if(!Array.isArray(list)) throw new Error('形式が違います');
        items = list.filter(function(x){
          return x && typeof x.lat === 'number' && typeof x.lon === 'number';
        });
        if(data && data.center) map.setView([data.center.lat, data.center.lon], 16);
        render();
        say(items.length + ' 件を読み込みました。');
      }catch(err){
        say('このファイルは読み込めませんでした（' + err.message + '）。', true);
      }
    };
    reader.readAsText(f);
    e.target.value = '';
  });

  loadInitial();
})();
</script>
</body>
</html>
